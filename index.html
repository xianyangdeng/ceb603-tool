<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>9610 报文生成工具（清单 CEB603 + 订单 CEB303）</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; background: #f0f2f5; color: #333; }
.header { background: linear-gradient(135deg, #1a3a5c 0%, #2b5c8a 100%); color: #fff; padding: 20px 30px; text-align: center; }
.header h1 { font-size: 22px; margin-bottom: 6px; }
.header p { font-size: 12px; opacity: 0.8; }
.toolbar { background: #fff; padding: 12px 30px; border-bottom: 1px solid #ddd; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.toolbar label { font-weight: bold; font-size: 13px; color: #555; }
.toolbar input[type=file] { display: none; }
.btn { padding: 8px 18px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-family: inherit; transition: all .2s; }
.btn-primary { background: #2b5c8a; color: #fff; }
.btn-primary:hover { background: #1a3a5c; }
.btn-success { background: #28a745; color: #fff; }
.btn-success:hover { background: #1e7e34; }
.btn-warning { background: #fd7e14; color: #fff; }
.btn-warning:hover { background: #e8590c; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.status { padding: 10px 30px; font-size: 13px; min-height: 20px; white-space: pre-line; line-height: 1.6; }
.status.info { background: #e7f3ff; color: #1a3a5c; }
.status.ok { background: #e7f7ee; color: #1e7e34; }

.main { display: flex; height: calc(100vh - 120px); }
.panel { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.panel-head { background: #f8f9fa; padding: 10px 15px; font-weight: bold; border-bottom: 1px solid #ddd; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
.panel-body { flex: 1; overflow: auto; padding: 15px; }
#preview { white-space: pre-wrap; font-family: 'Consolas', 'Monaco', monospace; font-size: 11px; line-height: 1.5; background: #fafafa; border: 1px solid #ddd; border-radius: 4px; padding: 12px; height: 100%; overflow: auto; }
#dataPreview { font-size: 12px; }
#dataPreview table { width: 100%; border-collapse: collapse; }
#dataPreview th, #dataPreview td { border: 1px solid #ddd; padding: 5px 8px; text-align: left; font-size: 11px; }

#dataPreview tr:nth-child(even) { background: #fafafa; }
.batch-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.batch-tab { padding: 4px 12px; border: 1px solid #2b5c8a; background: #fff; color: #2b5c8a; border-radius: 4px; cursor: pointer; font-size: 12px; }
.batch-tab.active { background: #2b5c8a; color: #fff; }
/* ===== 客户列表加载状态栏（仅后台校验，无需登录） ===== */
.client-bar { font-size: 12px; padding: 5px 30px; background: #fff8e6; color: #b7791f; border-bottom: 1px solid #f0e0c0; }
.client-bar.ok { background: #e7f7ee; color: #1e7e34; border-bottom-color: #c8e6d0; }
.client-bar.err { background: #fde8e8; color: #c00; border-bottom-color: #f5c2c2; }
/* ===== 报文类型识别提示 ===== */
.type-badge { display: inline-block; padding: 2px 10px; border-radius: 3px; font-size: 12px; font-weight: bold; margin-left: 8px; }
.type-badge.order { background: #e7f3ff; color: #1a3a5c; border: 1px solid #1a3a5c; }
.type-badge.inventory { background: #e7f7ee; color: #1e7e34; border: 1px solid #1e7e34; }
</style>
</head>
<body>
<!-- ===== 客户列表状态提示（仅后台校验，无需登录） ===== -->
<div id="clientBar" class="client-bar">客户列表加载中...</div>
<div class="header">
    <h1>9610 报文生成工具（订单 CEB303 / 清单 CEB603）<span id="typeBadge"></span></h1>
    <p>同一份清单模板可同时生成「清单报文 CEB603」和「订单报文 CEB303」→ 自动填充派生字段 → 生成标准 XML（每批 ≤99 单自动拆分 · CDATA · UTF-8无BOM）</p>
</div>
<div class="toolbar">
    <label>1.</label>
    <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">选择 Excel 文件</button>
    <input type="file" id="fileInput" accept=".xlsx,.xls">
    <span id="fileName" style="font-size:13px;color:#666;"></span>
    <label style="margin-left:15px;">2.</label>
    <span id="btnGroup" style="display:inline-flex;gap:10px;align-items:center;">
        <button class="btn btn-success" id="genInventoryBtn" onclick="generateInventoryXML()" disabled>生成清单报文(CEB603)</button>
        <button class="btn btn-warning" id="genOrderBtn" onclick="generateOrderFromInventoryXML()" disabled>生成订单报文(CEB303)</button>
    </span>
    <label style="margin-left:15px;">3.</label>
    <button class="btn btn-primary" id="dlBtn" onclick="downloadXML()" disabled>下载 XML</button>
</div>
<div class="status info" id="status">请先选择 Excel 模板文件</div>
<div class="main">
    <div class="panel">
        <div class="panel-head"><span>📊 数据预览</span></div>
        <div class="panel-body" id="dataPreview">
            <p style="color:#999;text-align:center;margin-top:40px;">选择文件后将在此显示数据预览</p>
        </div>
    </div>
    <div class="panel">
        <div class="panel-head">
            <span>📄 XML 报文预览</span>
            <span id="batchCount" style="font-size:12px;color:#666;"></span>
        </div>
        <div class="panel-body">
            <div class="batch-tabs" id="batchTabs"></div>
            <div id="preview">生成的 XML 报文将在此显示</div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
const BATCH_LIMIT = 99;          // 每个报文最多包含的订单数（≤99）
let excelData = null;
let batchXMLs = [];              // 拆分后的多份报文：[{name, xml}, ...]
document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    document.getElementById('fileName').textContent = file.name;
    setStatus('正在读取 Excel 文件...', 'info');
    const reader = new FileReader();
    reader.onload = function(ev) {
        try {
            const wb = XLSX.read(ev.target.result, { type: 'array' });
            excelData = wb;
            showPreview(wb);
            document.getElementById('genInventoryBtn').disabled = false;
            document.getElementById('genOrderBtn').disabled = false;
            setStatus('Excel 文件读取成功，请选择"生成清单报文(CEB603)"或"生成订单报文(CEB303)"', 'ok');
        } catch (err) {
            setStatus('读取失败: ' + err.message, 'err');
        }
    };
    reader.readAsArrayBuffer(file);
});
/**
 * 自动识别模板类型：
 *   - 订单模板（CEB303）：包含「电子订单」和「电子订单商品信息」两个 Sheet
 *   - 清单模板（CEB603）：包含「清单表头」和「清单商品明细」两个 Sheet
 * 返回 'order' | 'inventory' | null
 */
/**
 * 自动识别模板类型。
 * 订单模板（CEB303）支持两种 Sheet 命名（自动选取）：
 *   新规范：电子订单头 + 电子订单明细 + 订单商品
 *   旧规范：电子订单   + 电子订单商品信息
 * 清单模板（CEB603）：
 *   清单表头 + 清单商品明细（+ 传输信息）
 * 返回 { type, headSheet, listSheet, headType }，
 * 其中 headType = 'shared' 表示电子订单头是「整批共用一份企业信息」的布局，
 * 订单编号需从「电子订单明细」里读取。
 */
function detectType(wb) {
    const names = wb.SheetNames || [];
    const has = n => names.includes(n);
    // ---- 清单优先 ----
    if (has('清单表头') && has('清单商品明细')) {
        return { type: 'inventory', headSheet: '清单表头', listSheet: '清单商品明细' };
    }
    // ---- 订单：新规范（电子订单头 / 电子订单明细 / 订单商品）----
    const newHead = has('电子订单头');
    const newDetail = has('电子订单明细');
    const newGoods = has('订单商品');
    if (newHead && newDetail && newGoods) {
        return { type: 'order', headSheet: '电子订单头', listSheet: '电子订单明细',
                 goodsSheet: '订单商品', headType: 'shared' };
    }
    // ---- 订单：旧规范（电子订单 / 电子订单商品信息）----
    if (has('电子订单') && has('电子订单商品信息')) {
        return { type: 'order', headSheet: '电子订单', listSheet: '电子订单商品信息',
                 headType: 'row' };
    }
    return { type: null };
}
/** 订单表头中文列名 → 英文字段名 映射（用于 readSheet 无法直接解析中文表头时做二次映射） */
const ORDER_HEAD_MAP = {
    '订单类型':         'orderType',
    '电商订单编号':     'orderNo',
    '订仓单编号':       'orderNo',       // 新规范：电子订单明细里的订单编号字段
    '电商平台企业编号': 'ebpCode',
    '电商平台企业名称': 'ebpName',
    '电商企业编号':     'ebcCode',
    '电商企业名称':     'ebcName',
    '商品金额':         'goodsValue',
    '运杂费':           'freight',
    '币制':             'currency'
};
const ORDER_LIST_MAP = {
    '电商订单编号': 'orderNo',
    '订仓单编号':   'orderNo',       // 新规范：订单商品明细里的订单编号字段
    '序号':         'gnum',
    '企业商品货号': 'itemNo',
    '企业商品名称': 'itemName',
    '计量单位':     'unit',
    '币制':         'currency',
    '数量':         'qty',
    '单价':         'price',
    '总价':         'totalPrice',
    '企业商品描述': 'itemDescribe',
    '条形码':       'barCode'
};
/**
 * 读取并做字段名映射的通用解析：
 *   - 若单元格表头带 (英文字段名)，优先用英文名
 *   - 否则用 ORDER_HEAD_MAP / ORDER_LIST_MAP 做中文映射
 *   - 都没有 → 保留原中文表头作为字段名
 */
function readSheetMapped(wb, name, headerRow, map) {
    if (!wb.SheetNames.includes(name)) return [];
    const ws = wb.Sheets[name];
    const data = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
    if (data.length <= headerRow) return [];
    const fieldRow = data[1];
    const rows = data.slice(headerRow);
    return rows
        .filter(row => row.some(c => c !== '' && c !== undefined))
        .map(row => {
            const obj = {};
            fieldRow.forEach((key, i) => {
                if (!key) return;
                const matches = String(key).matchAll(/\(([^)]+)\)/g);
                const all = [...matches];
                let fieldName = all.length > 0 ? all[all.length - 1][1] : String(key).trim();
                // 中文表头走映射表
                if (map && map[fieldName]) fieldName = map[fieldName];
                obj[fieldName] = row[i] !== undefined ? String(row[i]) : '';
            });
            return obj;
        });
}
function showPreview(wb) {
    const det = detectType(wb);
    const type = det.type;
    const badge = document.getElementById('typeBadge');
    const genInventoryBtn = document.getElementById('genInventoryBtn');
    const genOrderBtn = document.getElementById('genOrderBtn');
    // 重置按钮
    genInventoryBtn.disabled = true;
    genOrderBtn.disabled = true;
    if (type === 'order') {
        badge.className = 'type-badge order';
        badge.textContent = '已识别：订单模板 CEB303';
        genInventoryBtn.disabled = false;
        genOrderBtn.disabled = false;
        window._detectedType = 'order';
        window._detect = det;
    } else if (type === 'inventory') {
        badge.className = 'type-badge inventory';
        badge.textContent = '已识别：清单模板 CEB603';
        genInventoryBtn.disabled = false;
        genOrderBtn.disabled = false;
        window._detectedType = 'inventory';
        window._detect = det;
    } else {
        badge.className = '';
        badge.textContent = '未识别';
        window._detectedType = null;
    }
    let html = '';
    let sheets = [];
    if (type === 'order') {
        const det = window._detect || detectType(wb);
        if (det.headType === 'shared') {
            sheets = [det.headSheet, det.listSheet, det.goodsSheet];
        } else {
            sheets = ['电子订单', '电子订单商品信息'];
        }
    } else if (type === 'inventory') {
        sheets = ['清单表头', '清单商品明细', '传输信息'];
    } else {
        sheets = wb.SheetNames || [];
    }
    sheets.forEach(name => {
        if (!wb.SheetNames.includes(name)) return;
        const ws = wb.Sheets[name];
        const data = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
        if (data.length < 5) return;
        const fields = data[1].map(c => (c || '').replace(/\n/g, ' ').trim());
        const rows = data.slice(4).filter(r => r.some(c => c !== ''));
        html += `<h4 style="margin:10px 0 5px;color:#2b5c8a;">${name} (${rows.length} 行)</h4>`;
        html += '<table><tr>';
        fields.forEach(f => html += `<th>${f}</th>`);
        html += '</tr>';
        rows.forEach(row => {
            html += '<tr>';
            fields.forEach((_, i) => html += `<td>${row[i] || ''}</td>`);
            html += '</tr>';
        });
        html += '</table>';
    });
    document.getElementById('dataPreview').innerHTML = html || '未找到有效数据，或模板类型无法识别（订单需含「电子订单头/电子订单明细/订单商品」或「电子订单/电子订单商品信息」，清单需含「清单表头/清单商品明细」）';
}
/**
 * 生成带 CDATA 的节点
 * val 为空 → 返回 ''（不生成任何节点）
 */
function cdataNode(name, val, indent) {
    if (val === '' || val === undefined || val === null) return '';
    const pad = ' '.repeat(indent);
    const escaped = escapeCdata(String(val));
    return `${pad}<ceb:${name}><![CDATA[${escaped}]]></ceb:${name}>\n`;
}
function escapeCdata(str) {
    return str.includes(']]>') ? str.replace(/\]\]>/g, ']]&gt;') : str;
}
/**
 * 生成不带 ceb: 前缀的 CDATA 节点（专供 CEB303 订单报文使用）
 * CEB303 根节点使用默认命名空间 xmlns="http://www.chinaport.gov.cn/ceb"，
 * 因此内部节点不能带 ceb: 前缀，否则会报"前缀未绑定"错误。
 */
function cdataNodeNoPrefix(name, val, indent) {
    if (val === '' || val === undefined || val === null) return '';
    const pad = ' '.repeat(indent);
    const escaped = escapeCdata(String(val));
    return `${pad}<${name}><![CDATA[${escaped}]]></${name}>\n`;
}
/** 14 位时间戳 yyyyMMddHHmmss */
function now14() {
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
}
function generateGUID() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16).toUpperCase();
    });
}
/** 俄语西里尔字母检测正则（覆盖俄语主要字母 + 扩展） */
const RUSSIAN_REGEX = /[\u0400-\u04FF\u0500-\u052F\u2DE0-\u2DFF\uA640-\uA69F]/;
/**
 * 校验 itemNo 是否合法：
 *   1. 不含俄语（西里尔字母）
 *   2. 长度 ≤ 20 个字符（按字符串字符数计）
 * 返回 { ok: boolean, reasons: string[] }
 */
function validateItemNo(itemNo) {
    const reasons = [];
    const val = String(itemNo == null ? '' : itemNo).trim();
    if (RUSSIAN_REGEX.test(val)) {
        reasons.push('含俄语字符');
    }
    if ([...val].length > 20) {
        reasons.push(`超长（${[...val].length} 字符，限 20）`);
    }
    return { ok: reasons.length === 0, reasons };
}
/**
 * 校验全部清单商品明细的 itemNo，返回错误列表：
 *   [{ orderNo, gnum, itemNo, reasons }]
 */
function validateAllItemNo(heads, lists) {
    // 建立 orderNo -> 表头（用于兜底显示）映射，同时保留表头顺序
    const errors = [];
    lists.forEach(item => {
        const orderNo = item.orderNo || '';
        if (!orderNo) return; // 无订单号的商品跳过（其它校验会提示）
        const r = validateItemNo(item.itemNo);
        if (!r.ok) {
            errors.push({
                orderNo: orderNo,
                gnum: item.gnum || '',
                itemNo: String(item.itemNo == null ? '' : item.itemNo),
                reasons: r.reasons
            });
        }
    });
    return errors;
}
/**
 * 生成一个 CEB603Message 报文（包含一批 orderHeads + 对应明细 + transfer）
 * @param {Array}  batchHeads  本批的清单表头数组（≤99）
 * @param {Object} listMap     orderNo -> 明细数组 的映射
 * @param {Array}  transfers   传输信息数组
 */
function buildMessageXML(batchHeads, listMap, transfers) {
    const msgGuid = generateGUID();
    let xml = '<?xml version="1.0" encoding="UTF-8"?>\n';
    xml += '<ceb:CEB603Message ';
    xml += `guid="${msgGuid}" `;
    xml += 'version="1.0"  ';
    xml += 'xmlns:ceb="http://www.chinaport.gov.cn/ceb" ';
    xml += 'xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">\n';
    batchHeads.forEach(head => {
        const orderNo = head.orderNo || '';
        // ===== 自动派生字段（按用户要求） =====
        const itemGuid    = generateGUID();
        const appType     = '1';                          // 默认 1=新增
        const appTime     = now14();                      // 当前时间 14 位
        const appStatus   = '2';                          // 默认 2=申报
        const copNo       = head.logisticsNo || '';        // 取 logisticsNo
        const ieFlag      = 'E';                          // 默认 E=出口
        const agentCode   = head.agentCode || '';
        const agentName   = head.agentName || '';
        const ebcCode     = agentCode;                    // 同 agentCode
        const ebcName     = agentName;                    // 同 agentName
        const ownerCode   = agentCode;                    // 同 agentCode
        const ownerName   = agentName;                    // 同 agentName
        const tradeMode   = '9610';                       // 默认 9610
        const trafMode    = '6';                          // 默认 6=邮件运输
        const fCurrency   = '142';                        // 默认 142=人民币
        const fFlag       = '3';                          // 默认 3=总价
        const insuredFee  = '0';                          // 默认 0
        const iCurrency   = '142';                        // 默认 142=人民币
        const iFlag       = '3';                          // 默认 3=总价
        const wrapType    = '2';                          // 默认 2=纸箱
        const packNo      = '1';                          // 默认 1
        const itemDefault = '无';                         // gmodel / barCode 默认值
        xml += '    <ceb:Inventory>\n';
        xml += '        <ceb:InventoryHead>\n';
        // ===== 清单表头字段（按样例节点顺序）=====
        xml += cdataNode('guid',            itemGuid,          12);
        xml += cdataNode('appType',         appType,           12);
        xml += cdataNode('appTime',         appTime,           12);
        xml += cdataNode('appStatus',       appStatus,         12);
        xml += cdataNode('customsCode',     head.customsCode,  12);
        xml += cdataNode('ebpCode',         head.ebpCode,      12);
        xml += cdataNode('ebpName',         head.ebpName,      12);
        xml += cdataNode('orderNo',         orderNo,           12);
        xml += cdataNode('logisticsCode',   head.logisticsCode, 12);
        xml += cdataNode('logisticsName',   head.logisticsName, 12);
        xml += cdataNode('logisticsNo',     head.logisticsNo,  12);
        xml += cdataNode('copNo',           copNo,             12);
        xml += cdataNode('ieFlag',          ieFlag,            12);
        xml += cdataNode('portCode',        head.portCode,     12);
        xml += cdataNode('ieDate',          head.ieDate,       12);
        xml += cdataNode('statisticsFlag',  head.statisticsFlag,12);
        xml += cdataNode('agentCode',       agentCode,        12);
        xml += cdataNode('agentName',       agentName,        12);
        xml += cdataNode('ebcCode',         ebcCode,          12);
        xml += cdataNode('ebcName',         ebcName,          12);
        xml += cdataNode('ownerCode',       ownerCode,        12);
        xml += cdataNode('ownerName',       ownerName,        12);
        xml += cdataNode('iacCode',         head.iacCode,     12);
        xml += cdataNode('iacName',         head.iacName,     12);
        xml += cdataNode('emsNo',           head.emsNo,       12);
        xml += cdataNode('tradeMode',       tradeMode,        12);
        xml += cdataNode('trafMode',        trafMode,         12);
        xml += cdataNode('trafName',        head.trafName,    12);
        xml += cdataNode('voyageNo',        head.voyageNo,    12);
        xml += cdataNode('billNo',          head.billNo,      12);
        xml += cdataNode('totalPackageNo',  head.totalPackageNo, 12);

        });
        xml += '    </ceb:Inventory>\n';

    // ===== BaseTransfer（每份报文都保留，取第一行传输信息） =====

    xml += cdataNode('note',     trans.note,     8);

    xml += '</ceb:CEB603Message>\n';
    return xml;
}

/**
 * 生成一个 CEB303Message 报文（包含一批订单）
 * 节点顺序与样例一致；空值字段不生成节点。
 */
function buildOrderMessageXML(batchHeads, listMap, transfers) {
    const msgGuid = generateGUID();
    let xml = '<?xml version="1.0" encoding="utf-8"?>\n';
    xml += '<CEB303Message ';
    xml += 'xmlns="http://www.chinaport.gov.cn/ceb" ';
    xml += 'xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" ';
    xml += `guid="${msgGuid}" `;
    xml += 'version="1.0">\n';
    batchHeads.forEach(head => {
        const orderNo = head.orderNo || '';
        // ===== 自动派生字段 =====
        const itemGuid  = generateGUID();
        const appType   = '1';        // 1=新增
        const appTime   = now14();    // 当前时间 14 位
        const appStatus = '2';        // 2=申报
        xml += '    <Order>\n';
        xml += '        <OrderHead>\n';
        // ===== 订单表头字段（按样例节点顺序）=====
        xml += cdataNodeNoPrefix('guid',       itemGuid,           12);
        xml += cdataNodeNoPrefix('appType',    appType,            12);
        xml += cdataNodeNoPrefix('appTime',    appTime,            12);
        xml += cdataNodeNoPrefix('appStatus',  appStatus,          12);
        xml += cdataNodeNoPrefix('orderType',  head.orderType,     12);
        xml += cdataNodeNoPrefix('orderNo',    orderNo,            12);
        xml += cdataNodeNoPrefix('ebpCode',    head.ebpCode,       12);
        xml += cdataNodeNoPrefix('ebpName',    head.ebpName,       12);
        xml += cdataNodeNoPrefix('ebcCode',    head.ebcCode,       12);
        xml += cdataNodeNoPrefix('ebcName',    head.ebcName,       12);
        xml += cdataNodeNoPrefix('goodsValue', head.goodsValue,    12);
        xml += cdataNodeNoPrefix('freight',    head.freight,       12);
        xml += cdataNodeNoPrefix('currency',   head.currency,      12);
        xml += cdataNodeNoPrefix('note',       head.note,          12);
        xml += '        </OrderHead>\n';
        // ===== 订单商品明细 =====
        const orderLists = listMap[orderNo] || [];
        orderLists.forEach(item => {
            xml += '        <OrderList>\n';
            xml += cdataNodeNoPrefix('gnum',        item.gnum,        12);
            xml += cdataNodeNoPrefix('itemNo',      item.itemNo,      12);
            xml += cdataNodeNoPrefix('itemName',    item.itemName,    12);
            xml += cdataNodeNoPrefix('itemDescribe',item.itemDescribe,12);
            xml += cdataNodeNoPrefix('barCode',     item.barCode,     12);
            xml += cdataNodeNoPrefix('unit',        item.unit,        12);
            xml += cdataNodeNoPrefix('currency',    item.currency,    12);
            xml += cdataNodeNoPrefix('qty',         item.qty,         12);
            xml += cdataNodeNoPrefix('price',       item.price,       12);
            xml += cdataNodeNoPrefix('totalPrice',  item.totalPrice,  12);
            xml += cdataNodeNoPrefix('note',        item.note,        12);
            xml += '        </OrderList>\n';
        });
        xml += '    </Order>\n';
    });
    // ===== BaseTransfer（有传输信息才生成，避免空壳标签） =====
    const trans = transfers[0] || {};
    const transChildren = [
        cdataNodeNoPrefix('copCode',  trans.copCode,  8),
        cdataNodeNoPrefix('copName',  trans.copName,  8),
        cdataNodeNoPrefix('dxpMode',  trans.dxpMode,  8),
        cdataNodeNoPrefix('dxpId',    trans.dxpId,    8),
        cdataNodeNoPrefix('note',     trans.note,     8)
    ].join('');
    if (transChildren) {
        xml += '    <BaseTransfer>\n' + transChildren + '    </BaseTransfer>\n';
    }
    xml += '</CEB303Message>\n';
    return xml;
}
/**
 * 读取订单模板数据，自动适配两种布局：
 *   shared（新规范）：电子订单头(整批共用企业信息) + 电子订单明细(订单行) + 订单商品(明细)
 *   row   （旧规范）：电子订单(表头行+订单行) + 电子订单商品信息(明细)
 * 返回 { heads, lists, transfers }。
 * heads 的每一项都携带本批共用的 ebcCode/ebcName/ebpCode/ebpName 字段。
 */
function readOrderData(wb) {
    const det = window._detect || detectType(wb);
    let shared = {};      // 整批共用的企业信息（新规范）
    let heads = [];
    if (det.headType === 'shared') {
        // ---- 新规范：企业信息从「电子订单头」固定位置提取 ----
        shared = readSharedHead(wb, det.headSheet);
        // 订单行从「电子订单明细」读取
        heads = readDetailSheet(wb, det.listSheet);
        // 将共用的企业信息填入每个订单
        heads = heads.map(h => Object.assign({}, shared, h));
    } else {
        // ---- 旧规范：标准表头行+数据行 ----
        heads = readSheetMapped(wb, '电子订单', 4, ORDER_HEAD_MAP);
    }
    // ---- 商品明细：新规范从「订单商品」，旧规范从「电子订单商品信息」----
    let lists;
    if (det.headType === 'shared') {
        lists = readGoodsSheet(wb, det.goodsSheet);
    } else {
        lists = readSheetMapped(wb, '电子订单商品信息', 4, ORDER_LIST_MAP);
    }
    // 传输信息
    let transfers = readSheetMapped(wb, '传输信息', 4, null);
    if (!transfers.length) transfers = readSheet(wb, '传输信息', 4);
    return { heads, lists, transfers };
}
/**
 * 读取「电子订单头」整批共用的企业信息。
 * 布局：R000 标题；R001=电商企业编号/电商企业名称；R002=电商平台企业编号/电商平台企业名称；
 *       R003=进/出口标志/主管海关代码；R004=备注。
 * 以「标签:」后的下一列为值。
 */
function readSharedHead(wb, sheetName) {
    if (!wb.SheetNames.includes(sheetName)) return {};
    const ws = wb.Sheets[sheetName];
    const data = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
    const result = { ebcCode: '', ebcName: '', ebpCode: '', ebpName: '', ebcCustoms: '' };
    const findVal = (label) => {
        for (let r = 0; r < data.length; r++) {
            const row = data[r];
            for (let c = 0; c < row.length; c++) {
                const cell = String(row[c] || '').replace(/[：:]/g, '');
                if (cell.indexOf(label) !== -1) {
                    // 优先取同行右侧相邻非空单元格
                    for (let cc = c + 1; cc < row.length; cc++) {
                        if (String(row[cc] || '').trim() !== '') return String(row[cc]).trim();
                    }
                    // 其次取下一行第一列
                    if (r + 1 < data.length) return String(data[r + 1][0] || '').trim();
                    return '';
                }
            }
        }
        return '';
    };
    const ebcCode = findVal('电商企业编号');
    const ebcName = findVal('电商企业名称');
    const ebpCode = findVal('电商平台企业编号');
    const ebpName = findVal('电商平台企业名称');
    // NULL / 空 统一置空
    const clean = v => (v === '' || v.toUpperCase() === 'NULL') ? '' : v;
    return {
        ebcCode: clean(ebcCode),
        ebcName: clean(ebcName),
        ebpCode: clean(ebpCode),
        ebpName: clean(ebpName)
    };
}
/**
 * 读取「电子订单明细」订单行。
 * R000 为标题行，R001 为合并表头行（订单类型/电商订单编号/商品金额/运杂费/币制），R002 起为数据。
 */
function readDetailSheet(wb, sheetName) {
    if (!wb.SheetNames.includes(sheetName)) return [];
    const ws = wb.Sheets[sheetName];
    const data = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
    // 找到表头行：含「订仓单编号」或「电商订单编号」或「订单类型」的行
    let headerRow = -1;
    for (let r = 0; r < Math.min(data.length, 6); r++) {
        const line = data[r].map(String).join(' ');
        if (line.indexOf('订仓单编号') !== -1 || line.indexOf('电商订单编号') !== -1 || line.indexOf('订单类型') !== -1) {
            headerRow = r;
            break;
        }
    }
    if (headerRow === -1 || headerRow + 1 >= data.length) return [];
    const fieldRow = data[headerRow];
    // 处理合并单元格：一个单元格内用换行分隔两个字段名，例如
    //   "电商订单/海外仓\n订仓单编号"
    // 数据行只有一列值，该值属于【第二个字段】（真正的列名），
    // 第一个是冗余的合并表头标题。因此每个单元格只保留换行后的【最后一段】作为列名。
    const fields = fieldRow.map(c => {
        const parts = String(c == null ? '' : c).split(/[\r\n]+/).map(s => s.trim()).filter(Boolean);
        if (!parts.length) return '';
        return parts[parts.length - 1];   // 取最后一段作为真实列名
    });
    const rows = data.slice(headerRow + 1);
    return rows
        .filter(row => row.some(c => c !== '' && c !== undefined))
        .map(row => {
            const obj = {};
            fields.forEach((key, i) => {
                if (!key) return;
                // 兼容合并单元格里被拆到多个列的情况：取第一个非空有效字段名
                let fieldName = key;
                // 中文表头走映射
                if (ORDER_HEAD_MAP[fieldName]) fieldName = ORDER_HEAD_MAP[fieldName];
                obj[fieldName] = row[i] !== undefined ? String(row[i]) : '';
            });
            return obj;
        });
}

function generateXML() {
    if (!excelData) return;
    try {
        const type = window._detectedType || detectType(excelData);
        if (!type) throw new Error('无法识别模板类型：请确认模板含「电子订单/电子订单商品信息」（订单 CEB303）或「清单表头/清单商品明细」（清单 CEB603）');
        if (type === 'order') {

        } else {
            return generateInventoryXML();
        }

/**
 * 生成清单报文 CEB603（含客户校验）
 */
function generateInventoryXML() {
    const heads = readSheet(excelData, '清单表头', 4);
    const lists = readSheet(excelData, '清单商品明细', 4);
    const transfers = readSheet(excelData, '传输信息', 4);
    if (!heads.length) throw new Error('清单表头无数据');
    if (!lists.length) throw new Error('清单商品明细无数据');
    if (!transfers.length) throw new Error('传输信息无数据');
    // ===== 校验清单表头 agentCode 是否都在客户列表 clients.csv 中 =====
    const agentErrors = validateAgentCode(heads);
    // ===== 必填项校验 =====
    const dataBySheet = { '清单表头': heads, '清单商品明细': lists, '传输信息': transfers };
    const requiredErrors = validateRequired(dataBySheet);
    // ===== 校验 itemNo：禁止俄语 / 禁止超 20 字符 =====
    const itemNoErrors = validateAllItemNo(heads, lists);
    // 任一校验不通过 → 合并提示，中止报文生成
    if (agentErrors.length || requiredErrors.length || itemNoErrors.length) {
        const parts = [];
        if (agentErrors.length) {
            parts.push(formatAgentErrors(agentErrors));
        }
        if (requiredErrors.length) {
            parts.push('【必填项缺失】\n' + formatRequiredErrors(requiredErrors));
        }
        if (itemNoErrors.length) {
            const byOrder = {};
            itemNoErrors.forEach(e => {
                if (!byOrder[e.orderNo]) byOrder[e.orderNo] = [];
                byOrder[e.orderNo].push(e);
            });
            const lines = Object.keys(byOrder).map(orderNo => {
                const items = byOrder[orderNo].map(e => {
                    const gnum = e.gnum ? `第${e.gnum}项` : '某项';
                    return `${gnum}「${e.itemNo}」(${e.reasons.join('、')})`;
                }).join('；');
                return `  订单 ${orderNo}：${items}`;
            });
            parts.push(
                `【itemNo 不合法】共 ${itemNoErrors.length} 条明细的 itemNo 含俄语或超 20 字符，` +
                `涉及 ${Object.keys(byOrder).length} 个订单：\n` +
                lines.join('\n')
            );
        }
        const totalIssues = requiredErrors.length + agentErrors.length + itemNoErrors.length;
        const msg =
            `❌ 校验未通过：共发现 ${totalIssues} 处问题，请修改后重试，本次未生成报文。\n\n` +
            parts.join('\n\n');
        // 清空上次结果
        batchXMLs = [];
        renderPreview();
        document.getElementById('dlBtn').disabled = true;
        setStatus(msg, 'err');
        return; // 中止报文生成
    }
    // 按 orderNo 将明细分组
    const listMap = {};
    lists.forEach(row => {
        const orderNo = row.orderNo || '';
        if (!orderNo) return;
        if (!listMap[orderNo]) listMap[orderNo] = [];
        listMap[orderNo].push(row);
    });
    // ===== 按每批 ≤99 单拆分 =====
    batchXMLs = [];
    const totalOrders = heads.length;
    for (let i = 0; i < totalOrders; i += BATCH_LIMIT) {
        const batchHeads = heads.slice(i, i + BATCH_LIMIT);
        const xml = buildMessageXML(batchHeads, listMap, transfers);
        const batchNo = batchXMLs.length + 1;
        const start = i + 1, end = Math.min(i + BATCH_LIMIT, totalOrders);
        batchXMLs.push({
            name: `CEB603Message_${String(batchNo).padStart(3, '0')}_订单${start}-${end}.xml`,
            xml: xml
        });
    }
    // ===== 渲染预览（含批次切换标签） =====
    renderPreview();
    const totalBatches = batchXMLs.length;
    document.getElementById('dlBtn').disabled = false;
    setStatus(
        `✅ 清单报文（CEB603）生成成功！共 ${totalOrders} 个清单（含 ${lists.length} 条商品明细），` +
        `按每批 ≤${BATCH_LIMIT} 单拆分为 ${totalBatches} 份报文。空值字段已自动删除。`,
        'ok'
    );
}

    if (agentErrors.length || requiredErrors.length || itemNoErrors.length) {
        const parts = [];
        if (agentErrors.length) {
            parts.push(formatAgentErrors(agentErrors));
        }
        if (requiredErrors.length) {
            parts.push('【必填项缺失】\n' + formatRequiredErrors(requiredErrors));
        }
        if (itemNoErrors.length) {
            const byOrder = {};
            itemNoErrors.forEach(e => {
                if (!byOrder[e.orderNo]) byOrder[e.orderNo] = [];
                byOrder[e.orderNo].push(e);
            });
            const lines = Object.keys(byOrder).map(orderNo => {
                const items = byOrder[orderNo].map(e => {
                    const gnum = e.gnum ? `第${e.gnum}项` : '某项';
                    return `${gnum}「${e.itemNo}」(${e.reasons.join('、')})`;
                }).join('；');
                return `  订单 ${orderNo}：${items}`;
            });
            parts.push(
                `【itemNo 不合法】共 ${itemNoErrors.length} 条明细的 itemNo 含俄语或超 20 字符，` +
                `涉及 ${Object.keys(byOrder).length} 个订单：\n` +
                lines.join('\n')
            );
        }
        const totalIssues = requiredErrors.length + agentErrors.length + itemNoErrors.length;
        const msg =
            `❌ 校验未通过：共发现 ${totalIssues} 处问题，请修改后重试，本次未生成报文。\n\n` +
            parts.join('\n\n');
        batchXMLs = [];
        renderPreview();
        document.getElementById('dlBtn').disabled = true;
        setStatus(msg, 'err');
        return;
    }
    // 按 orderNo 将明细分组
    const listMap = {};
    lists.forEach(row => {
        const orderNo = row.orderNo || '';
        if (!orderNo) return;
        if (!listMap[orderNo]) listMap[orderNo] = [];
        listMap[orderNo].push(row);
    });
    // ===== 计算每单商品总价之和（goodsValue）=====
    const goodsValueMap = {};
    heads.forEach(head => {
        const orderNo = head.orderNo || '';
        if (!orderNo) return;
        const orderLists = listMap[orderNo] || [];
        let sum = 0;
        orderLists.forEach(item => {
            const v = parseFloat(item.totalPrice);
            if (!isNaN(v)) sum += v;
        });
        // 保留 2 位小数
        goodsValueMap[orderNo] = sum.toFixed(2);
    });
    // ===== 按每批 ≤99 单拆分 =====
    batchXMLs = [];
    const totalOrders = heads.length;
    for (let i = 0; i < totalOrders; i += BATCH_LIMIT) {
        const batchHeads = heads.slice(i, i + BATCH_LIMIT);
        const xml = buildOrderFromInventoryXML(batchHeads, listMap, transfers, goodsValueMap);
        const batchNo = batchXMLs.length + 1;
        const start = i + 1, end = Math.min(i + BATCH_LIMIT, totalOrders);
        batchXMLs.push({
            name: `CEB303Message_${String(batchNo).padStart(3, '0')}_订单${start}-${end}.xml`,
            xml: xml
        });
    }
    renderPreview();
    const totalBatches = batchXMLs.length;
    document.getElementById('dlBtn').disabled = false;
    setStatus(
        `✅ 订单报文（CEB303）生成成功！共 ${totalOrders} 个订单（含 ${lists.length} 条商品明细），` +
        `按每批 ≤${BATCH_LIMIT} 单拆分为 ${totalBatches} 份报文。空值字段已自动删除。`,
        'ok'
    );
}
/**
 * 构建一份 CEB303 订单报文（从清单模板数据转换而来）
 * 节点顺序与 CEB303 样例一致；空值字段不生成节点。
 */
function buildOrderFromInventoryXML(batchHeads, listMap, transfers, goodsValueMap) {
    const msgGuid = generateGUID();
    let xml = '<?xml version="1.0" encoding="utf-8"?>\n';
    xml += '<CEB303Message ';
    xml += 'xmlns="http://www.chinaport.gov.cn/ceb" ';
    xml += 'xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" ';
    xml += `guid="${msgGuid}" `;
    xml += 'version="1.0">\n';
    batchHeads.forEach(head => {
        const orderNo = head.orderNo || '';
        // ===== 自动派生字段 =====
        const itemGuid  = generateGUID();
        const appType   = '1';        // 1=新增
        const appTime   = now14();    // 当前时间 14 位
        const appStatus = '2';        // 2=申报
        const orderType = 'E';        // E=出口
        const ebcCode   = head.agentCode || '';   // 申报单位代码 → 电商企业编号
        const ebcName   = head.agentName || '';   // 申报单位名称 → 电商企业名称
        const goodsValue = goodsValueMap[orderNo] || '0.00';
        const freight   = '0';        // 固定 0
        const currency  = '142';      // 固定 142=人民币
        xml += '    <Order>\n';
        xml += '        <OrderHead>\n';
        xml += cdataNodeNoPrefix('guid',       itemGuid,        12);
        xml += cdataNodeNoPrefix('appType',    appType,         12);
        xml += cdataNodeNoPrefix('appTime',    appTime,         12);
        xml += cdataNodeNoPrefix('appStatus',  appStatus,       12);
        xml += cdataNodeNoPrefix('orderType',  orderType,       12);
        xml += cdataNodeNoPrefix('orderNo',    orderNo,         12);
        xml += cdataNodeNoPrefix('ebpCode',    head.ebpCode,    12);
        xml += cdataNodeNoPrefix('ebpName',    head.ebpName,    12);
        xml += cdataNodeNoPrefix('ebcCode',    ebcCode,         12);
        xml += cdataNodeNoPrefix('ebcName',    ebcName,         12);
        xml += cdataNodeNoPrefix('goodsValue', goodsValue,      12);
        xml += cdataNodeNoPrefix('freight',    freight,         12);
        xml += cdataNodeNoPrefix('currency',   currency,        12);
        xml += cdataNodeNoPrefix('note',       head.note,       12);
        xml += '        </OrderHead>\n';
        // ===== 订单商品明细 =====
        const orderLists = listMap[orderNo] || [];
        orderLists.forEach(item => {
            xml += '        <OrderList>\n';
            xml += cdataNodeNoPrefix('gnum',         item.gnum,        12);
            xml += cdataNodeNoPrefix('itemNo',       item.itemNo,      12);
            xml += cdataNodeNoPrefix('itemName',     item.gname,       12);  // 申报用商品名称
            xml += cdataNodeNoPrefix('itemDescribe', item.gmodel,      12);  // 商品规格型号
            xml += cdataNodeNoPrefix('barCode',      item.barCode,     12);
            xml += cdataNodeNoPrefix('unit',         item.unit,        12);
            xml += cdataNodeNoPrefix('currency',     item.currency !== '' ? item.currency : '142', 12);
            xml += cdataNodeNoPrefix('qty',          item.qty,         12);
            xml += cdataNodeNoPrefix('price',        item.price,       12);
            xml += cdataNodeNoPrefix('totalPrice',   item.totalPrice,  12);
            xml += cdataNodeNoPrefix('note',         item.note,        12);
            xml += '        </OrderList>\n';
        });
        xml += '    </Order>\n';
    });
    // ===== BaseTransfer =====
    const trans = transfers[0] || {};
    const transChildren = [
        cdataNodeNoPrefix('copCode',  trans.copCode,  8),
        cdataNodeNoPrefix('copName',  trans.copName,  8),
        cdataNodeNoPrefix('dxpMode',  trans.dxpMode,  8),
        cdataNodeNoPrefix('dxpId',    trans.dxpId,    8),
        cdataNodeNoPrefix('note',     trans.note,     8)
    ].join('');
    if (transChildren) {
        xml += '    <BaseTransfer>\n' + transChildren + '    </BaseTransfer>\n';
    }
    xml += '</CEB303Message>\n';
    return xml;
}
/**

/** 渲染预览区域 + 批次切换标签 */
function renderPreview() {
    const tabsEl = document.getElementById('batchTabs');
    const previewEl = document.getElementById('preview');

    countEl.textContent = `共 ${batchXMLs.length} 份`;

    ).join('');

            tab.classList.add('active');

            previewEl.textContent = batchXMLs[idx].xml;
        });

}
function readSheet(wb, name, headerRow) {
    if (!wb.SheetNames.includes(name)) return [];
    const ws = wb.Sheets[name];
    const data = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
    if (data.length <= headerRow) return [];
    const fieldRow = data[1];
    const rows = data.slice(headerRow);
    return rows
        .filter(row => row.some(c => c !== '' && c !== undefined))
        .map(row => {
            const obj = {};
            fieldRow.forEach((key, i) => {
                if (key) {
                    const matches = String(key).matchAll(/\(([^)]+)\)/g);
                    const all = [...matches];
                    const fieldName = all.length > 0 ? all[all.length - 1][1] : String(key).trim();
                    obj[fieldName] = row[i] !== undefined ? String(row[i]) : '';
                }
            });
            return obj;
        });
}
/**

/** 判断一个单元格值是否为「空」：空串/undefined/null/纯空白/纯空标签 均视为空 */
function isEmptyCell(val) {
    if (val === undefined || val === null) return true;
    const s = String(val).trim();
    return s === '';
}
/**
 * 对一份数据做必填项校验，返回错误列表：
 *   [{ sheet, orderNo, gnum, fieldName, label, value }]
 */
function validateRequired(dataBySheet) {
    const errors = [];
    Object.keys(REQUIRED_FIELDS).forEach(sheetName => {
        const fields = REQUIRED_FIELDS[sheetName];
        const rows = dataBySheet[sheetName] || [];
        rows.forEach(row => {
            fields.forEach(f => {
                if (isEmptyCell(row[f.name])) {
                    errors.push({
                        sheet: sheetName,
                        orderNo: row.orderNo || '',
                        gnum: row.gnum || '',
                        fieldName: f.name,
                        label: f.label || f.name,
                        value: row[f.name]
                    });
                }
            });
        });
    });
    return errors;
}
/**
 * 把必填项校验错误汇总为可读的提示文本
 *  - 表头/传输信息：按 Sheet + 行号 + 字段 汇总
 *  - 商品明细：按 订单号 + 商品序号 + 字段 汇总
 */
function formatRequiredErrors(errors) {
    const lines = [`共 ${errors.length} 处必填项未填写：`];
    errors.forEach(e => {
        let loc;
        if (e.sheet === '清单商品明细') {
            loc = `订单 ${e.orderNo || '(缺失)'}${e.gnum ? ' 第' + e.gnum + '项' : ''}`;
        } else {
            loc = `${e.sheet}`;
        }
        lines.push(`  · ${loc} 的「${e.label}」(${e.fieldName}) 未填写`);
    });
    return lines.join('\n');
}
/* ============================================================

const ORDER_REQUIRED_FIELDS = {

function validateOrderRequired(dataBySheet) {
    const errors = [];

        const rows = dataBySheet[sheetName] || [];

function formatOrderRequiredErrors(errors) {

/** 校验订单商品明细的 itemNo（禁止俄语 / 超 20 字符） */
function validateAllOrderItemNo(heads, lists) {
    const errors = [];
    lists.forEach(item => {
        const orderNo = item.orderNo || '';
        if (!orderNo) return;
        const r = validateItemNo(item.itemNo);
        if (!r.ok) {
            errors.push({
                orderNo: orderNo,
                gnum: item.gnum || '',
                itemNo: String(item.itemNo == null ? '' : item.itemNo),
                reasons: r.reasons
            });
        }
    });

}
/** 下载：单份直接下载，多份打包为 ZIP */
function downloadXML() {
    if (!batchXMLs.length) return;
    // 根据当前报文类型决定压缩包命名
    const type = window._detectedType || 'inventory';
    const prefix = type === 'order' ? 'CEB303Message' : 'CEB603Message';
    if (batchXMLs.length === 1) {
        downloadSingle(batchXMLs[0].name, batchXMLs[0].xml);
        return;
    }
    // 多份 → 打包 ZIP
    if (!window.JSZip) {
        setStatus('ZIP 库未加载，无法打包，改为下载第一份。请检查网络后重试。', 'warn');
        downloadSingle(batchXMLs[0].name, batchXMLs[0].xml);
        return;
    }
    const zip = new JSZip();
    batchXMLs.forEach(b => zip.file(b.name, b.xml));
    zip.generateAsync({ type: 'blob' }).then(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${prefix}_拆分${batchXMLs.length}份.zip`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    });
}
function downloadSingle(fileName, xml) {
    const blob = new Blob([xml], { type: 'application/xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

/* ============================================================

let clientList = [];        // [{customsCode, companyName}, ...] 中山客户列表（clients.csv）
/**
 * 规范化客户列表中的海关编码，用于比对：
 *   - 去前后空白
 *   - 统一全角数字为半角
 *   - 去掉可能存在的小数点尾零（如 CSV 中 1105910159.00）
 */
function normCode(code) {
    let s = String(code == null ? '' : code).trim();
    s = s.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)); // 全角→半角
    s = s.replace(/\.0+$/, '').replace(/(\.\d*?)0+$/, '$1'); // 去尾零 1105910159.00 → 1105910159
    return s;
}
/** 比对两个海关编码是否一致（规范化后） */
function codeEqual(a, b) {
    return normCode(a) !== '' && normCode(a) === normCode(b);
}
/**
 * 解析 CSV 文本（支持 UTF-8 BOM、逗号/制表符分隔、双引号转义）
 * 跳过空行和纯注释行（# 开头）
 * 每行：第一列=海关编码，第二列=单位名称
 */
function parseCSV(text) {
    let t = text;
    if (t.charCodeAt(0) === 0xFEFF) t = t.slice(1); // 去 BOM
    const lines = t.split(/\r?\n/);
    const rows = [];
    for (let raw of lines) {
        const line = raw.trim();
        if (!line || line.startsWith('#')) continue;
        // 优先逗号分隔，若首行没有逗号则按制表符
        let cols;
        if (line.includes(',')) {
            cols = splitCSVLine(line);
        } else {
            cols = line.split(/\t/);
        }
        const code = (cols[0] || '').trim();
        const name = (cols[1] || '').trim();
        if (!code) continue;
        rows.push({ customsCode: normCode(code), companyName: name });
    }
    return rows;
}
/** 按 RFC 4180 规则拆分一行 CSV（处理引号内逗号） */
function splitCSVLine(line) {
    const result = [];
    let cur = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (inQuotes) {
            if (ch === '"') {
                if (line[i + 1] === '"') { cur += '"'; i++; }
                else { inQuotes = false; }
            } else {
                cur += ch;
            }
        } else {
            if (ch === '"') inQuotes = true;
            else if (ch === ',') { result.push(cur); cur = ''; }
            else cur += ch;
        }
    }
    result.push(cur);
    return result;
}
/** 查找客户：返回 {customsCode, companyName} 或 null */
function findClient(code) {
    const target = normCode(code);
    if (!target) return null;
    for (const c of clientList) {
        if (c.customsCode === target) return c;
    }
    return null;
}
/* ============================================================
 * ===== agentCode 客户列表校验 =====
 * 去掉登录环节：不再要求用户输入海关编码登录。
 * 改为在「生成清单报文」时，校验模板中「清单表头」的 agentCode
 * 是否存在于客户列表（clients.csv）中：
 *   - 存在 → 视为中山客户，允许生成
 *   - 不存在 → 提示"非中山客户，无法转换"，拒绝生成
 * 多订单场景下逐条核对，只要有一条不在列表中即整体拒绝并列出订单号。
 * ============================================================ */
function validateAgentCode(heads) {
    const errors = [];
    heads.forEach((head, idx) => {
        const ac = head.agentCode;
        if (!findClient(ac)) {
            errors.push({
                ok: false,
                orderNo: head.orderNo || `第${idx + 1}条表头`,
                agentCode: ac,
                reason: `清单表头 agentCode「${ac || '（空）'}」在客户列表中未找到，非中山客户无法转换`
            });
        }
    });
    return errors;
}
/* ============================================================
 * 校验结果展示：把 agentCode 校验错误格式化为用户提示
 * ============================================================ */
function formatAgentErrors(errors) {
    const byOrder = {};
    errors.forEach(e => {
        if (!byOrder[e.orderNo]) byOrder[e.orderNo] = [];
        byOrder[e.orderNo].push(e);
    });
    const lines = Object.keys(byOrder).map(orderNo => {
        const items = byOrder[orderNo].map(e =>
            `清单表头 agentCode「${e.agentCode || '（空）'}」`
        ).join('、');
        return `  订单 ${orderNo}：${items} 在客户列表中未找到，非中山客户无法转换`;
    });
    return `【非中山客户】共 ${errors.length} 条清单的 agentCode 不在客户列表中，拒绝转换：\n` + lines.join('\n');
}
/** 初始化：后台加载客户列表 CSV（不弹登录框，仅用于校验） */
function loadClientList() {
    const bar = document.getElementById('clientBar');
    bar.className = '';
    bar.textContent = '客户列表加载中...';
    fetch('clients.csv')
        .then(resp => {
            if (!resp.ok) throw new Error('无法读取 clients.csv（HTTP ' + resp.status + '）');
            return resp.text();
        })
        .then(text => {
            clientList = parseCSV(text);
            if (!clientList.length) {
                bar.className = 'err';
                bar.textContent = '⚠️ 客户列表为空，请检查 clients.csv 内容（将无法通过客户校验）';
                return;
            }
            bar.className = 'ok';
            bar.textContent = `✅ 客户列表已加载，生成报文时将校验 agentCode`;
        })
        .catch(err => {
            bar.className = 'err';
            bar.textContent = '⚠️ 客户列表加载失败：' + err.message + '。若以本地文件双击打开，请用 serve.bat / serve.sh 启动 HTTP 服务';
        });
}
// 页面加载后自动后台加载客户列表
loadClientList();
</script>
